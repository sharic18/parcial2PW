<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <nav class="barra navbar navbar-dark px-3">
    <span class="navbar-brand">Mis consultas asignadas</span>
    <span class="text-white ms-auto me-3" id="quien"></span>
    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
  </nav>

  <main class="container my-4">
    <div id="alerta"></div>
    <table class="table bg-white">
      <thead><tr><th>Paciente</th><th>Motivo</th><th>Consultorio</th><th>Horario</th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
  <script>
    async function cargar() {
      try {
        const lista = await api('/api/medico/consultas');
        document.getElementById('tabla').innerHTML = lista.map(c => `
          <tr><td>${esc(c.nombre_paciente)}</td><td>${esc(c.motivo)}</td><td>${esc(c.numero_consultorio)}</td>
          <td>${hora(c.hora_inicio)} - ${hora(c.hora_fin)}</td></tr>`).join('')
          || '<tr><td colspan="4" class="text-muted">No tiene consultas asignadas.</td></tr>';
      } catch (e) { mostrar(mensajeError(e), 'danger'); }
    }
    mostrarUsuario(); cargar();
  </script>
</body>
</html>
