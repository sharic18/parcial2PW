<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Consultas médicas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="d-flex align-items-center" style="min-height:100vh">
  <main class="container" style="max-width:420px">
    <div class="tarjeta shadow-sm p-4">
      <h1 class="h4 mb-1">Consultas médicas</h1>
      <p class="text-muted">Ingrese sus credenciales para continuar.</p>
      <div id="alerta"></div>
      <form id="formLogin">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control mb-3" id="username" autocomplete="username" required>
        <label class="form-label" for="password">Clave</label>
        <input class="form-control mb-4" id="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const destinos = { ADMIN: 'admin.html', MEDICO: 'medico.html', PACIENTE: 'paciente.html' };

    document.getElementById('formLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const datos = await resp.json().catch(() => ({}));
      if (resp.ok) location.href = destinos[datos.rol];
      else mostrar(datos.error || 'No fue posible iniciar sesión', 'danger');
    });
  </script>
</body>
</html>
