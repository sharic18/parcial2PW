<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso restringido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="d-flex align-items-center" style="min-height:100vh">
  <main class="container" style="max-width:520px">
    <div class="tarjeta shadow-sm p-4 text-center">
      <h1 class="h4">Acceso restringido</h1>
      <p id="detalle" class="mb-4">Su rol no tiene permisos para realizar esta acción.</p>
      <a id="volver" class="btn btn-primary" href="index.html">Volver al inicio de sesión</a>
      <button class="btn btn-outline-secondary" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const inicio = { ADMIN: 'admin.html', MEDICO: 'medico.html', PACIENTE: 'paciente.html' };
    fetch('/api/auth/me', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(u => {
      if (!u) return;
      document.getElementById('detalle').textContent =
        `Su rol (${u.rol}) no tiene permisos para realizar esta acción. Solo puede usar las opciones de su perfil.`;
      const v = document.getElementById('volver');
      v.href = inicio[u.rol];
      v.textContent = 'Volver a mi panel';
    });
  </script>
</body>
</html>
