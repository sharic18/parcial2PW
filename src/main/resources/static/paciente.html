<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del paciente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <nav class="barra navbar navbar-dark px-3">
    <span class="navbar-brand">Mis citas</span>
    <span class="text-white ms-auto me-3" id="quien"></span>
    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
  </nav>

  <main class="container my-4">
    <div id="alerta"></div>
    <p class="text-muted">Puede cambiar el horario de sus citas y guardar con «Actualizar horario».</p>
    <table class="table bg-white align-middle">
      <thead><tr><th>Motivo</th><th>Consultorio</th><th>Médico</th><th>Inicio</th><th>Fin</th><th></th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
  <script>
    async function cargar() {
      try {
        const lista = await api('/api/paciente/consultas');
        document.getElementById('tabla').innerHTML = lista.map(c => `
          <tr>
            <td>${esc(c.motivo)}</td><td>${esc(c.numero_consultorio)}</td><td>${esc(c.medico)}</td>
            <td><input type="time" class="form-control form-control-sm" id="i${c.id}" value="${hora(c.hora_inicio)}"></td>
            <td><input type="time" class="form-control form-control-sm" id="f${c.id}" value="${hora(c.hora_fin)}"></td>
            <td><button class="btn btn-sm btn-primary" onclick="actualizar(${c.id})">Actualizar horario</button></td>
          </tr>`).join('')
          || '<tr><td colspan="6" class="text-muted">No tiene citas asignadas.</td></tr>';
      } catch (e) { mostrar(mensajeError(e), 'danger'); }
    }

    async function actualizar(id) {
      const cuerpo = {
        horaInicio: document.getElementById('i' + id).value || null,
        horaFin: document.getElementById('f' + id).value || null
      };
      try {
        await api(`/api/paciente/consultas/${id}/horario`, { method: 'PUT', body: JSON.stringify(cuerpo) });
        mostrar('Horario actualizado');
        cargar();
      } catch (e) { mostrar(mensajeError(e), 'danger'); }
    }

    mostrarUsuario(); cargar();
  </script>
</body>
</html>
